# PetGuardian — nginx site (Ubuntu / t3.micro)
#
# Deploy layout (atomic releases, easy rollback):
#   /var/www/petguardian/releases/<timestamp>/   <- uploaded build
#   /var/www/petguardian/current -> releases/<ts>  <- swapped symlink
#
# Installed to /etc/nginx/sites-available/petguardian by setup-server.sh.
# TLS (443, certbot) is appended later by `certbot --nginx`; the HTTP
# block below is what serves the app until a certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain after DNS points here

    root /var/www/petguardian/current;
    index index.html;

    # main.dart.js and the font/asset payloads are megabytes; compression is
    # the single biggest latency win for a Flutter web app on a small VM.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain
        text/javascript;

    # Flutter builds hash content under assets/ — safe to cache forever.
    # index.html and flutter_bootstrap.js must revalidate every load, or
    # clients keep running the previous engine bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(wasm|js|css|png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    # Service worker must always be fresh or stale workers pin old versions.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Basic hardening headers. No CSP: Flutter web injects its bootstrap
    # scripts and a strict policy breaks the engine without careful nonces.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Flutter web is a SPA: hash routes still resolve to index.html so a
    # refresh on a deep link never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not serve dotfiles (.git, editor leftovers in a release dir).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/petguardian.access.log;
    error_log  /var/log/nginx/petguardian.error.log;
}
