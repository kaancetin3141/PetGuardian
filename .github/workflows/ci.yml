name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        # Fails the job on errors and warnings, not just on info-level lints.
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

  flutter-test:
    runs-on: ubuntu-latest
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --no-pub

  flutter-build-web:
    runs-on: ubuntu-latest
    needs: flutter-analyze
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --no-pub

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          # firebase-tools 15.x refuses to start the Firestore emulator on
          # anything older than Java 21.
          distribution: temurin
          java-version: '21'
      - name: Install rule-test deps
        run: npm ci || npm install
      # The emulator has to be running: @firebase/rules-unit-testing refuses to
      # start without a host/port. emulators:exec boots it and tears it down.
      - name: Run rules unit tests
        run: npx firebase-tools emulators:exec --only firestore --project petguardian-test "node test/firestore.rules.test.js"